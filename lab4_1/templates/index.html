{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Filmoteka - All Films</title>
    <link rel="stylesheet" href="{% static 'bootstrap.css' %}">
    <style>
        body { background-color: #f4f4f4; }
        .navbar { background-color: #11111a; border-bottom: 3px solid #dc3545; }
        .navbar-brand { color: white !important; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">🎬 FILMOTEKA</a>
            <span class="text-secondary ms-auto" style="font-size: 0.8rem; letter-spacing: 1px;">YOUR PERSONAL FILM ARCHIVE</span>
        </div>
    </nav>

    <div class="container">
        <div class="mb-4 bg-dark text-white p-4 rounded">
            <h2 class="text-uppercase fw-bold">ALL FILMS</h2>
            <p class="text-secondary">{{ movies.count }} titles in the archive</p>
        </div>

        <div class="row row-cols-1 row-cols-md-4 g-4">
            {% for movie in movies %}
            <div class="col">
                <div class="card h-100 border-0 shadow-sm">
                    <a href="{% url 'details' movie.id %}">
                        {% if movie.poster %}
                            <img src="{{ movie.poster.url }}" class="card-img-top" alt="{{ movie.title }}">
                        {% endif %}
                    </a>
                    <div class="card-body">
                        <h6 class="card-title fw-bold">{{ movie.title }}</h6>
                        <p class="card-text text-danger" style="font-size: 0.9rem;">{{ movie.price }} den.</p>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
